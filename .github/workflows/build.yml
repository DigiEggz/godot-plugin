name: Build Plugin

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install ARM64 Cross Linker
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu

      - name: Build Linux x86_64 Binary
        run: cargo build --manifest-path src/Cargo.toml --release --target x86_64-unknown-linux-gnu

      - name: Build Linux ARM64 Binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --manifest-path src/Cargo.toml --release --target aarch64-unknown-linux-gnu

      - name: Organize Linux Binaries
        run: |
          mkdir -p addons/nodetunnel/bin/linux/x86_64
          mkdir -p addons/nodetunnel/bin/linux/arm64
          cp src/target/x86_64-unknown-linux-gnu/release/libnodetunnel.so addons/nodetunnel/bin/linux/x86_64/
          cp src/target/aarch64-unknown-linux-gnu/release/libnodetunnel.so addons/nodetunnel/bin/linux/arm64/

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nodetunnel-linux
          path: addons/nodetunnel/bin/linux/

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc, aarch64-pc-windows-msvc

      - name: Build 64-bit Windows
        run: cargo build --manifest-path src/Cargo.toml --release --target x86_64-pc-windows-msvc

      - name: Build ARM64 Windows
        run: cargo build --manifest-path src/Cargo.toml --release --target aarch64-pc-windows-msvc

      - name: Organize Windows Binaries
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          
          New-Item -ItemType Directory -Force -Path "addons/nodetunnel/bin/windows/arm64"
          New-Item -ItemType Directory -Force -Path "addons/nodetunnel/bin/windows/x86_64"
          
          Copy-Item "src/target/aarch64-pc-windows-msvc/release/*.dll" -Destination "addons/nodetunnel/bin/windows/arm64/" -Verbose
          Copy-Item "src/target/x86_64-pc-windows-msvc/release/*.dll" -Destination "addons/nodetunnel/bin/windows/x86_64/" -Verbose

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nodetunnel-windows
          path: addons/nodetunnel/bin/windows/

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin, aarch64-apple-darwin

      - name: Build macOS Binaries
        run: |
          cargo build --manifest-path src/Cargo.toml --release --target x86_64-apple-darwin
          cargo build --manifest-path src/Cargo.toml --release --target aarch64-apple-darwin

      - name: Create Universal Binary
        run: |
          mkdir -p src/target/universal-apple-darwin/release
          lipo -create -output src/target/universal-apple-darwin/release/libnodetunnel.dylib \
            src/target/x86_64-apple-darwin/release/libnodetunnel.dylib \
            src/target/aarch64-apple-darwin/release/libnodetunnel.dylib

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v7
        with:
          name: nodetunnel-macos
          path: src/target/universal-apple-darwin/release/libnodetunnel.dylib

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Android Shared Libraries
        working-directory: src
        run: |
          cargo ndk -t aarch64-linux-android -t x86_64-linux-android -o ../addons/nodetunnel/bin/android build --release

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nodetunnel-android
          path: addons/nodetunnel/bin/android/
