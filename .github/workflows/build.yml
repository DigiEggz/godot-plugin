name: Build Plugin

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build Linux Binary
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nodetunnel-linux
          path: target/x86_64-unknown-linux-gnu/release/libnodetunnel.so

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc, i686-pc-windows-msvc, aarch64-pc-windows-msvc

      - name: Build Windows Binaries
        run: |
          cargo build --release --target x86_64-pc-windows-msvc
          cargo build --release --target i686-pc-windows-msvc
          cargo build --release --target aarch64-pc-windows-msvc

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nodetunnel-windows
          path: |
            target/x86_64-pc-windows-msvc/release/*.dll
            target/i686-pc-windows-msvc/release/*.dll
            target/aarch64-pc-windows-msvc/release/*.dll

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin, aarch64-apple-darwin

      - name: Build macOS Binaries
        run: |
          cargo build --release --target x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin

      - name: Create Universal Binary
        run: |
          mkdir -p target/universal-apple-darwin/release
          lipo -create -output target/universal-apple-darwin/release/libnodetunnel.dylib \
            target/x86_64-apple-darwin/release/libnodetunnel.dylib \
            target/aarch64-apple-darwin/release/libnodetunnel.dylib

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nodetunnel-macos
          path: target/universal-apple-darwin/release/libnodetunnel.dylib

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Set up Android NDK
        uses: nsetup/setup-android-ndk@v1
        with:
          ndk-version: r26b

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Android Shared Libraries
        run: |
          cargo ndk -t aarch64-linux-android -t armv7-linux-androideabi -t x86_64-linux-android -o addons/nodetunnel/bin/android build --release

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nodetunnel-android
          path: addons/nodetunnel/bin/android/
